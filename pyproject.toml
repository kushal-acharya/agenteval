[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenteval"
version = "0.1.0"
description = "Eval + tracing harness for LLM agents: golden sets, layered scorers, pass^k reliability, regression diffs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kushal Acharya", email = "akushal845@gmail.com" }]
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
agenteval = "agenteval.cli:main"

[tool.setuptools.packages.find]
include = ["agenteval*"]
