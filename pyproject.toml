[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenteval"
version = "0.1.0"
description = "Eval + tracing harness for LLM agents: golden sets, layered scorers, pass^k reliability, regression diffs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kushal Acharya", email = "akushal845@gmail.com" }]
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Only examples/fars_sql_agent.py needs an SDK. The harness itself stays
# model-independent and depends on nothing but pydantic — that is the point of
# the AgentAdapter interface, and `pip install agenteval` should not drag in a
# vendor SDK to grade an agent that may not use one.
claude = ["anthropic>=0.40"]

[project.scripts]
agenteval = "agenteval.cli:main"

[tool.setuptools.packages.find]
include = ["agenteval*"]
